# English texts (DESIGN.md §22.2). Every key here must exist in every other locale file with the
# same {placeholders}; the locales tests fail otherwise. Bot messages have several variants, so
# the bot never sends the same text over and over (§10.3). Placeholders are {lowercase_names}.
#
# v0.1 sends its replies, review cards and help pages from the built-in catalogue in
# internal/review/catalog.go and catalog_cmd.go, which is their only source. The messages below
# are the variant templates the locales tests check; none of them duplicates a sent text.
lang: en
dir: ltr

messages:
  onboarding.protection_on:
    - "✅ Protection is on in \"{group}\" ({preset}). I stay silent there. Send .pending to see uncertain cases, or .reviewgroup here in a separate admins-only group to get them as they come in."
    - "✅ \"{group}\" is now protected ({preset}, silent). Uncertain cases wait for you: send .pending to see them, or .reviewgroup here in an admins-only group."
  command.done:
    - "Done."
    - "Done ✔"

# Command names (DESIGN.md §13.7): canonical name → the words that invoke it in this language.
commands:
  spam: [spam]
  notspam: [notspam, ok]
  ban: [ban]
  kick: [kick]
  mute: [mute]
  unmute: [unmute]
  allow: [allow]
  unallow: [unallow]
  blacklist: [blacklist]
  clear: [clear]
  restrict: [restrict]
  restricted: [restricted]
  unban: [unban]
  network: [network]
  lockdown: [lockdown]
  unlock: [unlock]
  undo: [undo]
  review: [review]
  reviewers: [reviewers]
  reviewer: [reviewer]
  reviewgroup: [reviewgroup]
  askadmins: [askadmins]
  autoban: [autoban]
  pending: [pending]
  status: [status]
  mode: [mode]
  preset: [preset]
  block: [block]
  blocknew: [blocknew]
  policy: [policy]
  silent: [silent]
  ladder: [ladder]
  newsignal: [newsignal]
  domain: [domain]
  word: [word]
  set: [set]
  get: [get]
  settings: [settings]
  groups: [groups]
  use: [use]
  login: [login]
  help: [help]

# Review reply keywords (DESIGN.md §9.5): decision → the replies that mean it.
keywords:
  ban: [ban, kick]
  not_spam: [ok, not spam]
  delete_only: [delete only]
  clear: [clear]
  mute: [mute]
  all_ok: [all ok]
  all_spam: [all spam]
