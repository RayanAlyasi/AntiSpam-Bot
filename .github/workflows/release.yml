# Release workflow (DESIGN.md §23.10): release-please → GoReleaser → back-merge, in one workflow.
#
# A tag created with GITHUB_TOKEN can't start another workflow, so nothing here waits for a tag
# push. On every push to main (or release/*), release-please keeps its release PR up to date.
# When that PR has just been merged, it creates the vX.Y.Z tag and a draft release; GoReleaser
# then builds, signs, attests, uploads and publishes; finally main is merged back into staging.
#
# Needs the release GitHub App (docs/RELEASING.md): the `release` environment holds
# vars.RELEASE_APP_CLIENT_ID and secrets.RELEASE_APP_PRIVATE_KEY.
name: release

on:
  push:
    branches: [main, "release/**"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rp:
    name: release-please
    runs-on: ubuntu-24.04
    environment: release
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: goreleaser
    needs: rp
    if: needs.rp.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # upload to and publish the draft release
      packages: write # push images to ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write # actions/attest
    env:
      TAG: ${{ needs.rp.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # release-please swallows a 422 on tag creation (e.g. blocked by the v* tag ruleset), so a
      # missing tag would otherwise surface later as a confusing GoReleaser error.
      - name: Check the release tag exists, is SemVer and is on this branch
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::release-please returned tag '$TAG', which isn't vX.Y.Z SemVer"
            exit 1
          fi
          if ! git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"; then
            echo "::error::tag $TAG doesn't exist: release-please reported a release but the tag wasn't created (check the v* tag ruleset's bypass for the release App)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/$TAG^{commit}" "$GITHUB_SHA"; then
            echo "::error::tag $TAG points at a commit that isn't on $GITHUB_REF_NAME"
            exit 1
          fi
          git checkout --detach "refs/tags/$TAG"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ env.TAG }}
      - name: Collect image digest
        id: image
        run: |
          # dockers_v2 images are listed as "Docker Image"; every tag shares the manifest-list digest.
          digest="$(jq -r '[.[] | select(.type == "Docker Image" and (.name | startswith("ghcr.io/rayanalyasi/antispam-bot:"))) | .extra.Digest // empty] | first // empty' dist/artifacts.json)"
          if [ -z "$digest" ]; then
            echo "::error::no image digest in dist/artifacts.json"
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (archives)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Attest build provenance (image)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/rayanalyasi/antispam-bot
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

  back-merge:
    name: back-merge into staging
    needs: [rp, goreleaser]
    if: needs.rp.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    environment: release
    env:
      TAG: ${{ needs.rp.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # A throwaway sync/<branch>-<tag> branch rather than a PR from main itself: a conflict can
      # be resolved on it by hand without committing to main. The App's token makes the PR run CI.
      - name: Open the back-merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch="sync/${GITHUB_REF_NAME//\//-}-$TAG"
          if ! gh api "repos/$GH_REPO/git/ref/heads/$branch" --silent 2>/dev/null; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA" --silent
          fi
          pr="$(gh pr list --head "$branch" --base staging --state open --json url --jq '.[0].url // empty')"
          if [ -z "$pr" ]; then
            pr="$(gh pr create --base staging --head "$branch" \
              --title "chore: merge $GITHUB_REF_NAME back into staging after $TAG" \
              --body "Brings the release commit, \`CHANGELOG.md\` and \`.release-please-manifest.json\` from \`$GITHUB_REF_NAME\` back into \`staging\` after $TAG (DESIGN.md §23.10).

          **Merge with a merge commit, never squash.**")"
          fi
          echo "Back-merge PR: $pr"
          # GitHub computes mergeability in the background; wait for it before judging.
          for _ in $(seq 1 20); do
            state="$(gh pr view "$pr" --json mergeable --jq .mergeable)"
            [ "$state" != "UNKNOWN" ] && break
            sleep 6
          done
          if [ "$state" = "CONFLICTING" ]; then
            gh pr comment "$pr" --body "This back-merge has conflicts with \`staging\`. Resolve them on \`$branch\` (merge \`staging\` into it and push), then merge this PR with a merge commit."
            echo "::warning::back-merge PR $pr has conflicts; left open for the maintainer"
          fi
