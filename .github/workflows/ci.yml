name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

# A newer push to a PR supersedes the older run, so that one is cancelled. Pushes to main and
# staging get one group per commit, so every merge runs to the end on the combined code.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The gate runs as parallel jobs. "make check (ubuntu-24.04)" waits for the amd64 jobs and is
  # what the branch rules require, together with "make check (ubuntu-24.04-arm)" and
  # "multi-arch image", so the required check names didn't change when the gate was split.
  static:
    name: static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # The tamper audit and new-issue lint compare against a local staging (or main).
      - name: Make base branches available locally
        run: |
          for b in main staging; do
            git show-ref --verify --quiet "refs/heads/$b" || git fetch --no-tags origin "$b:$b" || true
          done
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install linters
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.15.0
          go install github.com/fe3dback/go-arch-lint@v1.19.0
      - run: go build ./...
      - run: go vet ./...
      - name: lint
        run: if [ -f .golangci.yml ]; then golangci-lint run ./...; else echo "no .golangci.yml, skipped"; fi
      - name: architecture
        run: if [ -f .go-arch-lint.yml ]; then go-arch-lint check; else echo "no .go-arch-lint.yml, skipped"; fi
      - name: sqlc drift
        run: go tool -modfile=tools/go.mod sqlc diff
      - name: tamper audit
        run: python3 harness/scripts/tamper.py

  unit:
    name: unit tests (amd64)
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  unit-arm:
    name: make check (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  # Only the packages with integration-tagged tests, against real Postgres (testcontainers).
  integration:
    name: integration tests
    runs-on: ubuntu-24.04
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test -tags integration
        run: |
          pkgs=$(grep -rl --include='*_test.go' '^//go:build integration' . | xargs -n1 dirname | sort -u)
          go test -race -count=1 -tags integration $pkgs

  gate:
    name: make check (ubuntu-24.04)
    needs: [static, unit, integration]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: All amd64 jobs passed
        run: |
          echo "static=${{ needs.static.result }} unit=${{ needs.unit.result }} integration=${{ needs.integration.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.unit.result }}" = success ] && [ "${{ needs.integration.result }}" = success ]

  image:
    name: multi-arch image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/amd64 and linux/arm64 (CGO_ENABLED=0)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Edge images (DESIGN.md §23.4): every push to staging that passes the gate publishes
  # :edge and :sha-<7> for testing. Never latest or a version tag; those come from releases.
  edge:
    name: edge image
    needs: [gate, unit-arm, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags and labels
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rayanalyasi/antispam-bot:edge
            ghcr.io/rayanalyasi/antispam-bot:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=antispam-bot
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=edge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
