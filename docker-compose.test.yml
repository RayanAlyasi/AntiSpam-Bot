# Throwaway Postgres for local integration tests (`docker compose -f docker-compose.test.yml up -d`).
# CI and `make check` use testcontainers instead; this is for poking at the schema by hand.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: antispam
      POSTGRES_PASSWORD: antispam
      POSTGRES_DB: antispam_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antispam -d antispam_test"]
      interval: 2s
      timeout: 3s
      retries: 15
