# English command names and review keywords (DESIGN.md §22.2). Every key here must exist in every
# other locale file; the locales tests fail otherwise.
#
# The texts the bot sends (replies, review cards, help pages, onboarding) live only in the
# built-in catalogue in internal/review/catalog.go and catalog_cmd.go, so `messages` is empty.
lang: en
dir: ltr

messages: {}

# Command names (DESIGN.md §13.7): canonical name → the words that invoke it in this language.
commands:
  spam: [spam]
  notspam: [notspam, ok]
  ban: [ban]
  kick: [kick]
  mute: [mute]
  unmute: [unmute]
  allow: [allow]
  unallow: [unallow]
  blacklist: [blacklist]
  clear: [clear]
  restrict: [restrict]
  restricted: [restricted]
  unban: [unban]
  network: [network]
  lockdown: [lockdown]
  unlock: [unlock]
  undo: [undo]
  review: [review]
  reviewers: [reviewers]
  reviewer: [reviewer]
  reviewgroup: [reviewgroup]
  askadmins: [askadmins]
  autoban: [autoban]
  pending: [pending]
  status: [status]
  mode: [mode]
  preset: [preset]
  block: [block]
  blocknew: [blocknew]
  policy: [policy]
  silent: [silent]
  ladder: [ladder]
  newsignal: [newsignal]
  domain: [domain]
  word: [word]
  set: [set]
  get: [get]
  settings: [settings]
  groups: [groups]
  use: [use]
  login: [login]
  help: [help]

# Review reply keywords (DESIGN.md §9.5): decision → the replies that mean it.
keywords:
  ban: [ban, kick]
  not_spam: [ok, not spam]
  delete_only: [delete only]
  clear: [clear]
  mute: [mute]
  all_ok: [all ok]
  all_spam: [all spam]
