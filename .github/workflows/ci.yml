name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

permissions: {}

# A newer push to a PR supersedes the older run, so that one is cancelled. Pushes to main and
# staging get one group per commit, so every merge runs to the end on the combined code.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tools are pinned here or in tools/go.mod and installed with the Go toolchain, so no
# third-party action is needed to run them.
env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GITLEAKS_VERSION: v8.30.1
  ACTIONLINT_VERSION: v1.7.12

jobs:
  # The gate runs as parallel jobs. "make check (ubuntu-24.04)" waits for the amd64 jobs and is
  # what the branch rules require, together with "make check (ubuntu-24.04-arm)" and
  # "multi-arch image", so the required check names didn't change when the gate was split.
  static:
    name: static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # The tamper audit compares against a local staging (or main).
      - name: Make base branches available locally
        run: |
          for b in main staging; do
            git show-ref --verify --quiet "refs/heads/$b" || git branch --quiet "$b" "origin/$b"
          done
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: |
          go mod tidy -diff
          (cd tools && go mod tidy -diff)
      - run: go build ./...
      - run: go vet ./...
      - name: sqlc drift
        run: go tool -modfile=tools/go.mod sqlc diff
      - name: tamper audit
        run: python3 harness/scripts/tamper.py

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
      # Linters, formatters and the architecture rules (depguard) all live in .golangci.yml.
      - name: golangci-lint
        run: |
          if [ ! -f .golangci.yml ]; then
            echo "::error::.golangci.yml is missing, so lint would run with the defaults only"
            exit 1
          fi
          golangci-lint run ./...

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go tool -modfile=tools/go.mod govulncheck ./...
      - name: Install gitleaks
        run: go install "github.com/zricethezav/gitleaks/v8@$GITLEAKS_VERSION"
      # Scans the commits a PR or a push adds. A push with no usable "before" (a new branch or
      # a force push) scans the whole history.
      - name: gitleaks
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          echo "scanning $range"
          gitleaks git --no-banner --redact --log-opts="$range" .

  unit:
    name: unit tests (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  unit-arm:
    name: make check (ubuntu-24.04-arm)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test -race -shuffle=on ./...

  # Only the packages with integration-tagged tests, against real Postgres (testcontainers).
  integration:
    name: integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test -tags integration
        run: |
          mapfile -t pkgs < <(grep -rl --include='*_test.go' '^//go:build integration' . | xargs -n1 dirname | sort -u)
          go test -race -count=1 -tags integration "${pkgs[@]}"

  # The bot runs on arm64 servers, so before a release the integration tests run there too: on
  # every push to staging and main, not on each PR.
  integration-arm:
    name: integration tests (arm64)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go test -tags integration
        run: |
          mapfile -t pkgs < <(grep -rl --include='*_test.go' '^//go:build integration' . | xargs -n1 dirname | sort -u)
          go test -race -count=1 -tags integration "${pkgs[@]}"

  # actionlint also runs shellcheck (preinstalled on the runner) over the run: scripts.
  actionlint:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: actionlint
        run: go run "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"

  gate:
    name: make check (ubuntu-24.04)
    needs: [static, lint, security, unit, integration, actionlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: All amd64 jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  image:
    name: multi-arch image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/amd64 and linux/arm64 (CGO_ENABLED=0)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Edge images (DESIGN.md §23.4): every push to staging that passes every job, including the
  # arm64 integration tests, publishes :edge and :sha-<7> for testing. Never latest or a version
  # tag; those come from releases.
  edge:
    name: edge image
    needs: [gate, unit-arm, integration-arm, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags and labels
        id: meta
        run: |
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rayanalyasi/antispam-bot:edge
            ghcr.io/rayanalyasi/antispam-bot:sha-${{ steps.meta.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=antispam-bot
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=edge
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
