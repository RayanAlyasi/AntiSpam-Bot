# Dependency updates (DESIGN.md §23.9), grouped per ecosystem and opened against staging.
# whatsmeow has no tags, so Dependabot can't bump its pseudo-version; the weekly
# whatsmeow-bump workflow does that instead.
version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/tools"]
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: go.mau.fi/whatsmeow
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      compose:
        patterns: ["*"]
