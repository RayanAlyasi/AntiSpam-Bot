# النصوص العربية (DESIGN.md §22.2). Arabic texts: same keys and {placeholders} as en.yaml.
# v0.1 sends its Arabic replies from internal/review/catalog.go and catalog_cmd.go (see en.yaml).
lang: ar
dir: rtl

messages:
  onboarding.protection_on:
    - "✅ الحماية مفعّلة في \"{group}\" ({preset})، وأبقى صامتاً هناك. أرسل .معلق لعرض الحالات غير المؤكدة، أو .مجموعة_المراجعة here في مجموعة منفصلة للمشرفين فقط لتصلك أولاً بأول."
    - "✅ أصبحت \"{group}\" محمية ({preset}، صامت). الحالات غير المؤكدة تنتظرك: أرسل .معلق لعرضها، أو .مجموعة_المراجعة here في مجموعة للمشرفين فقط."
  command.done:
    - "تم."
    - "تم ✔"

