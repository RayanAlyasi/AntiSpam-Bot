# PR title lint (DESIGN.md §23.11). PRs into staging are squash-merged with the title as the
# commit message, and release-please reads those commits, so the title must be a Conventional
# Commit. pull_request_target lets it run for fork PRs; it never checks out PR code.
name: pr title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
    branches: [staging]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    name: conventional commit title
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            refactor
            test
            ci
            build
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" of the PR title "{title}" starts with an uppercase letter.
            Use a lowercase, imperative description, e.g. "feat: add phone-number blacklist command".
